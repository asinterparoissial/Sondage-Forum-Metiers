<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum des Métiers - Collège</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1a365d; text-align: center; }
        p.subtitle { text-align: center; color: #666; margin-bottom: 25px; }
        .student-info { display: flex; gap: 15px; margin-bottom: 25px; background: #edf2f7; padding: 20px; border-radius: 8px; flex-wrap: wrap; }
        .student-info div { flex: 1; min-width: 200px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #2d3748; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        
        .counter-box { background: #ebf8ff; border: 1px solid #bee3f8; color: #2b6cb0; padding: 15px; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 25px; }
        .counter-box.complete { background: #f0fff4; border-color: #c6f6d5; color: #22543d; }

        .domain-section { margin-bottom: 20px; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
        .domain-title { background: #2d3748; color: white; padding: 10px 15px; font-weight: bold; font-size: 15px; }
        .jobs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; padding: 12px; background: #f8fafc; }
        
        .job-card { background: white; border: 2px solid #e2e8f0; padding: 10px; border-radius: 6px; cursor: pointer; text-align: center; font-size: 13px; user-select: none; transition: 0.1s; }
        .job-card:hover { border-color: #cbd5e0; }
        .job-card.selected { background: #c6f6d5; border-color: #38a169; color: #22543d; font-weight: bold; }

        .submit-container { text-align: center; margin-top: 30px; }
        button#submit-btn { background: #3182ce; color: white; border: none; padding: 12px 30px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        button#submit-btn:disabled { background: #cbd5e0; cursor: not-allowed; }

        #success-message { display: none; text-align: center; padding: 40px; }
        #success-message h2 { color: #38a169; }
    </style>
</head>
<body>

<div class="container" id="form-container">
    <h1>Forum des Métiers - Collège</h1>
    <p class="subtitle">Sélectionne exactement <strong>6 métiers différents par ordre de préférence et 2 métiers maximum par domaine</strong> ci-dessous.</p>

    <div class="student-info">
        <div>
            <label for="classe">Classe :</label>
            <select id="classe">
                <option value="">-- Choisir --</option>
                <option value="3ème Bulgarie">3ème Bulgarie</option>
                <option value="3ème Estonie">3ème Estonie</option>
                <option value="3ème Pologne">3ème Pologne</option>
            </select>
        </div>
        <div>
            <label for="nom">Nom :</label>
            <input type="text" id="nom" placeholder="Ton nom">
        </div>
        <div>
            <label for="prenom">Prénom :</label>
            <input type="text" id="prenom" placeholder="Ton prénom">
        </div>
    </div>

    <div class="counter-box" id="counter">
        Métiers sélectionnés : 0 / 6
    </div>

    <div id="domains-container"></div>

    <div class="submit-container">
        <button id="submit-btn" disabled onclick="envoyerVoix()">Valider mes 6 vœux</button>
    </div>
</div>

<div class="container" id="success-message">
    <h2>🎉 Vœux enregistrés avec succès !</h2>
    <p>Tes choix ont bien été pris en compte. Tu peux fermer cette page.</p>
</div>

<script>
    const domainsData = [
        { domain: "Santé & Social", jobs: ["Infirmier / Aide Soignant", "Kinésithérapeute", "Médecin généraliste", "Pharmacien", "Auxiliaire de vie", "Éducateur spécialisé"] },
        { domain: "Artisanat & Bâtiment", jobs: ["Boulanger-Pâtissier", "Électricien", "Plombier-Chauffagiste", "Maçon", "Menuisier", "Peintre en bâtiment"] },
        { domain: "Commerce & Vente", jobs: ["Vendeur en magasin", "Boucher-Charcutier", "Coiffeur", "Esthéticien", "Chef de rayon", "Fleuriste"] },
        { domain: "Transport & Automobile", jobs: ["Mécanicien automobile", "Chauffeur routier", "Conducteur de bus", "Carrossier", "Logisticien", "Livreur"] },
        { domain: "Sécurité & Défense", jobs: ["Pompier", "Gendarme", "Policier", "Agent de sécurité", "Militaire", "Gardien de la paix"] },
        { domain: "Enseignement & Éducation", jobs: ["Professeur des écoles (maternelle/primaire)", "Professeur de collège/lycée", "Éducateur sportif", "Animateur périscolaire", "Surveillant / Assistant d'éducation", "Conseiller principal d'éducation (CPE)"] },
        { domain: "Informatique & Numérique", jobs: ["Développeur web", "Technicien support informatique", "Community manager", "Infographiste", "Expert cybersécurité", "Vendeur high-tech"] },
        { domain: "Administration, Droit & Banque", jobs: ["Secrétaire / Assistant de gestion", "Comptable", "Conseiller bancaire", "Agent immobilier", "Employé de mairie / administration", "Assistant juridique"] },
        { domain: "Restauration & Tourisme", jobs: ["Cuisinier", "Serveur en restaurant", "Réceptionniste d'hôtel", "Boucher", "Pâtissier", "Employé de restauration rapide"] },
        { domain: "Agriculture & Environnement", jobs: ["Agriculteur / Polyculteur", "Paysagiste / Jardinier / Élagueur", "Vétérinaire", "Agent d'entretien des espaces verts", "Éleveur", "Technicien en traitement des déchets"] },
        { domain: "Art, Design & Culture", jobs: ["Graphiste", "Photographe", "Bibliothécaire", "Animateur socioculturel", "Coiffeur-Styliste", "Décorateur d'intérieur / Architecte"] },
        { domain: "Finance & Gestion", jobs: ["Comptable", "Assistant de gestion", "Conseiller bancaire", "Secrétaire comptable", "Gestionnaire de paie", "Contrôleur de gestion"] },
        { domain: "Ressources Humaines", jobs: ["Assistant RH", "Chargé de recrutement", "Gestionnaire de formation", "Secrétaire administratif", "Conseiller en insertion", "Chargé de communication interne"] },
        { domain: "Ingénierie & Industrie", jobs: ["Technicien de maintenance", "Opérateur de production", "Dessinateur-industriel", "Électricien industriel", "Responsable qualité", "Logisticien"] },
        { domain: "Communication & Marketing", jobs: ["Community manager", "Chargé de communication", "Graphiste", "Secrétaire de rédaction", "Attaché de presse", "Vendeur conseil"] }
    ];

    let selectedJobs = [];
    const maxSelection = 6;
    const maxPerDomain = 2;
    const scriptURL = "https://script.google.com/macros/s/AKfycbx3NmVXMYdslO59RVgphp7oGQ2_7o6Q_ost3Bi4_e9Oit72Kfk0HQ01DBduLJIK0J88fQ/exec";

    function init() {
        const container = document.getElementById("domains-container");
        if (!container) return;
        
        domainsData.forEach(group => {
            let section = document.createElement("div");
            section.className = "domain-section";
            
            let title = document.createElement("div");
            title.className = "domain-title";
            title.innerText = group.domain;
            section.appendChild(title);

            let grid = document.createElement("div");
            grid.className = "jobs-grid";

            group.jobs.forEach(job => {
                let card = document.createElement("div");
                card.className = "job-card";
                card.innerText = job;
                card.onclick = () => toggleJob(job, group.domain, card);
                grid.appendChild(card);
            });

            section.appendChild(grid);
            container.appendChild(section);
        });
    }

    function toggleJob(jobName, domainName, cardElement) {
        const index = selectedJobs.indexOf(jobName);
        
        if (index > -1) {
            // Désélection du métier
            selectedJobs.splice(index, 1);
            cardElement.classList.remove("selected");
        } else {
            // Limite globale de 6 métiers max
            if (selectedJobs.length >= maxSelection) {
                alert("Tu as déjà sélectionné 6 métiers maximum ! Clique sur un métier déjà choisi pour le désélectionner.");
                return;
            }

            // Limite de 2 métiers max par domaine
            const domainObj = domainsData.find(d => d.domain === domainName);
            const countInDomain = selectedJobs.filter(job => domainObj.jobs.includes(job)).length;

            if (countInDomain >= maxPerDomain) {
                alert("2 métiers maximum par domaine, pour libérer une place, désélectionne un des métiers.");
                return;
            }

            // Ajout de la sélection
            selectedJobs.push(jobName);
            cardElement.classList.add("selected");
        }
        updateCounter();
    }

    function updateCounter() {
        const counterBox = document.getElementById("counter");
        const submitBtn = document.getElementById("submit-btn");
        
        counterBox.innerText = `Métiers sélectionnés : ${selectedJobs.length} / ${maxSelection}`;
        
        if (selectedJobs.length === maxSelection) {
            counterBox.classList.add("complete");
            submitBtn.disabled = false;
        } else {
            counterBox.classList.remove("complete");
            submitBtn.disabled = true;
        }
    }

    function envoyerVoix() {
        const classe = document.getElementById("classe").value;
        const nom = document.getElementById("nom").value.trim();
        const prenom = document.getElementById("prenom").value.trim();

        if (!classe || !nom || !prenom) {
            alert("Renseigne ta classe, ton nom et ton prénom !");
            return;
        }

        if (selectedJobs.length !== 6) {
            alert("Il faut exactement 6 métiers.");
            return;
        }

        const btn = document.getElementById("submit-btn");
        btn.innerText = "Envoi...";
        btn.disabled = true;

        const formData = {
            classe: classe,
            nom: nom,
            prenom: prenom,
            metiers: selectedJobs
        };

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(() => {
            document.getElementById("form-container").style.display = "none";
            document.getElementById("success-message").style.display = "block";
        })
        .catch(error => {
            alert("Erreur lors de l'envoi.");
            btn.innerText = "Valider mes 6 vœux";
            btn.disabled = false;
        });
    }

    window.onload = init;
</script>

</body>
</html>
